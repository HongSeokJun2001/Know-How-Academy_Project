spring.application.name=Know-How-Academy_Project
server.servlet.context-path=/know-how
server.port=8002

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=SEMI
spring.datasource.password=SEMI

## 마이바티스 연동 구문
#mybatis-config.xml 파일을 찾아갈 경로 설정
mybatis.config-location=classpath:mybatis-config.xml
#mybatis.config-location == mybatis-config.xml파일의 위치를 지정하기위한 작업
#classpath: == src/main/resouces 경로를 의미
#classpath:mybatis-config.xml == src/main/resouces

#mapper.xml 파일을 찾아갈 경로 설정
mybatis.mapper-locations=classpath:mappers/board/*.xml
#mybatis.mapper-locations == 매퍼파일의 위치설정
#classpath: == src/main/resouces/mappers/board/*.xml
#board 폴더 내부의 모든 xml파일을 불러온다.